name: Build SOHEL AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract Flutter Project
        run: |
          mkdir app
          unzip -o SOHEL_AI_MOVIE_TRANSLATOR_Starter.zip -d app
          cp -R app/. .

      - name: Create Android Project
        run: flutter create . --platforms=android --project-name sohel_ai_movie_translator

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOHEL-AI-MOVIE-TRANSLATOR-APK
          path: build/app/outputs/flutter-apk/app-release.apk
